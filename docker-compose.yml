services:
  monitor-return:
    build: .
    image: monitor-return:latest
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # One-shot lossy/reordered API demo:
  #   docker compose --profile demo run --rm demo
  demo:
    image: monitor-return:latest
    profiles: ["demo"]
    depends_on:
      monitor-return:
        condition: service_healthy
    volumes:
      - ./demo_out:/tmp/demo_out
    entrypoint:
      - python
      - scripts/demo.py
      - --url
      - http://monitor-return:8000
      - --out
      - /tmp/demo_out
